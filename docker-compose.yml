services:
  # -------------------------
  # Redis - Shared State Store
  # -------------------------
  redis:
    image: ${REDIS_IMAGE}
    container_name: redis-state
    restart: unless-stopped

    ports:
      - "${REDIS_HOST_PORT}:${REDIS_PORT}"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

    networks:
      - rate-limiter-net

  # -------------------------
  # Primary Rate Limiter
  # -------------------------
  rate-limiter-primary:
    build:
      context: .
      dockerfile: Dockerfile

    image: ${RATE_LIMITER_IMAGE}
    container_name: rate-limiter-primary
    restart: unless-stopped

    ports:
      - "${PRIMARY_PORT}:${PRIMARY_PORT}"

    environment:
      RATE_LIMITER_PORT: "${PRIMARY_PORT}"
      RATE_LIMITER_ROLE: "${PRIMARY_ROLE}"
      RATE_LIMITER_INSTANCE_ID: "${PRIMARY_INSTANCE_ID}"

      REDIS_HOST: "${REDIS_HOST}"
      REDIS_PORT: "${REDIS_PORT}"

      RATE_LIMIT_CAPACITY: "${RATE_LIMIT_CAPACITY}"
      RATE_LIMIT_REFILL_RATE: "${RATE_LIMIT_REFILL_RATE}"

      BACKEND_URL: "${BACKEND_URL}"

      EVENT_REPORTING_URL: "${EVENT_REPORTING_URL}"
      MACHINE_ID: "${MACHINE_ID}"

    depends_on:
      redis:
        condition: service_healthy
      event-receiver:
        condition: service_started

    networks:
      - rate-limiter-net

  # -------------------------
  # Shadow Rate Limiter
  # -------------------------
  rate-limiter-shadow:
    build:
      context: .
      dockerfile: Dockerfile

    image: ${RATE_LIMITER_IMAGE}
    container_name: rate-limiter-shadow
    restart: unless-stopped

    ports:
      - "${SHADOW_PORT}:${SHADOW_PORT}"

    environment:
      RATE_LIMITER_PORT: "${SHADOW_PORT}"
      RATE_LIMITER_ROLE: "${SHADOW_ROLE}"
      RATE_LIMITER_INSTANCE_ID: "${SHADOW_INSTANCE_ID}"

      REDIS_HOST: "${REDIS_HOST}"
      REDIS_PORT: "${REDIS_PORT}"

      RATE_LIMIT_CAPACITY: "${RATE_LIMIT_CAPACITY}"
      RATE_LIMIT_REFILL_RATE: "${RATE_LIMIT_REFILL_RATE}"

      BACKEND_URL: "${BACKEND_URL}"

      EVENT_REPORTING_URL: "${EVENT_REPORTING_URL}"
      MACHINE_ID: "${MACHINE_ID}"

    depends_on:
      redis:
        condition: service_healthy
      event-receiver:
        condition: service_started

    networks:
      - rate-limiter-net

  # -------------------------
  # Gateway
  # -------------------------
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway

    container_name: rate-limiter-gateway
    restart: unless-stopped

    ports:
      - "${GATEWAY_HOST_PORT}:${GATEWAY_PORT}"

    environment:
      GATEWAY_PORT: "${GATEWAY_PORT}"
      PRIMARY_URL: "http://rate-limiter-primary:${PRIMARY_PORT}"
      SECONDARY_URL: "http://rate-limiter-shadow:${SHADOW_PORT}"

    depends_on:
      - rate-limiter-primary
      - rate-limiter-shadow

    networks:
      - rate-limiter-net

  # -------------------------
  # Event Receiver
  # -------------------------
  event-receiver:
    build:
      context: .
      dockerfile: Dockerfile.event-receiver

    container_name: event-receiver
    restart: unless-stopped

    ports:
      - "${EVENT_RECEIVER_HOST_PORT}:${EVENT_RECEIVER_PORT}"

    networks:
      - rate-limiter-net
    # -------------------------
    # Failure Detector
    # -------------------------
  failure-detector:
    build:
      context: .
      dockerfile: Dockerfile.detector

    container_name: rate-limiter-detector
    restart: unless-stopped

    environment:
      TARGET_URL: "${TARGET_URL}"
      RECOVERY_URL: "${RECOVERY_URL}"
      EVENT_REPORTING_URL: "${EVENT_REPORTING_URL}"
      CHECK_INTERVAL: "${CHECK_INTERVAL}"
      REQUEST_TIMEOUT: "${REQUEST_TIMEOUT}"
      FAILURE_THRESHOLD: "${FAILURE_THRESHOLD}"
      RATE_LIMITER_INSTANCE_ID: "${RATE_LIMITER_INSTANCE_ID}"
      MACHINE_ID: "${MACHINE_ID}"

    depends_on:
      - rate-limiter-primary
      - rate-limiter-shadow
      - recovery-manager
      - event-receiver

    networks:
      - rate-limiter-net

  # -------------------------
  # Recovery Manager
  # -------------------------
  recovery-manager:
    build:
      context: .
      dockerfile: Dockerfile.recovery

    container_name: rate-limiter-recovery
    restart: unless-stopped

    environment:
      RECOVERY_PORT: "${RECOVERY_PORT}"
      SHADOW_URL: "${SHADOW_URL}"
      EVENT_REPORTING_URL: "${EVENT_REPORTING_URL}"
      RATE_LIMITER_INSTANCE_ID: "${RECOVERY_INSTANCE_ID}"
      PRIMARY_INSTANCE_ID: "${PRIMARY_INSTANCE_ID}"
      MACHINE_ID: "${MACHINE_ID}"

    depends_on:
      - rate-limiter-primary
      - rate-limiter-shadow
      - event-receiver

    networks:
      - rate-limiter-net

    ports:
      - "${RECOVERY_HOST_PORT}:${RECOVERY_PORT}"
    # -------------------------
    # Prometheus Monitoring
    # -------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    depends_on:
      - cadvisor

    networks:
      - rate-limiter-net

  # -------------------------
  # cAdvisor Container Metrics
  # -------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped

    ports:
      - "8085:8080"

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

    privileged: true
    devices:
      - /dev/kmsg

    networks:
      - rate-limiter-net

# -------------------------
# Persistent Redis Data
# -------------------------
volumes:
  redis_data:
    external: true
    name: redis_redis_data
  
  prometheus_data:

# -------------------------
# Shared Docker Network
# -------------------------
networks:
  rate-limiter-net:
    driver: bridge
